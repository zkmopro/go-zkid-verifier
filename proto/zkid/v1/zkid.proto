syntax = "proto3";

package zkid.v1;

option go_package = "github.com/zkmopro/go-zkid-verifier/proto/zkid/v1;zkidv1";

service ZkIDVerifier {
  // CreateChallenge generates a new challenge nonce for ZK verification.
  rpc CreateChallenge(CreateChallengeRequest) returns (CreateChallengeResponse);

  // GetChallenge retrieves a challenge by ID.
  rpc GetChallenge(GetChallengeRequest) returns (GetChallengeResponse);

  // LinkVerify verifies cert-chain and device-sig proofs with pk_commit linkage.
  rpc LinkVerify(LinkVerifyRequest) returns (LinkVerifyResponse);
}

message CreateChallengeRequest {}

message CreateChallengeResponse {
  string challenge_id = 1;
  // 62-char lowercase hex of the per-challenge 31-byte app_id.
  string app_id = 2;
  string expires_at = 3;
}

message GetChallengeRequest {
  string challenge_id = 1;
}

message GetChallengeResponse {
  string challenge_id = 1;
  string app_id = 2;
  string expires_at = 3;
}

message LinkVerifyRequest {
  string challenge_id = 1;
  // "rs2048" (default) or "rs4096"
  string cert_chain_type = 2;
  // Binary proof data (no base64 needed in gRPC)
  bytes cert_chain_proof = 3;
  bytes device_sig_proof = 4;
}

message LinkVerifyResponse {
  bool verified = 1;
  string nullifier = 2;
  bool id_verified = 3;
  bool persisted = 4;
  string error = 5;
  // "proof_invalid", "smt_root_mismatch", "issuer_modulus_mismatch", or "app_id_mismatch"; empty when verified=true.
  string reason = 6;
  // Populated when SMT root enforcement ran; unset when SMT_ROOT_ENFORCE=disabled.
  SmtRootOutcome smt_root = 7;
  // Populated when issuer-cert enforcement ran; unset when ISSUER_CERT_ENFORCE=disabled.
  IssuerModulusOutcome issuer_modulus = 8;
  // Always populated on a verified proof: the per-challenge app_id binding
  // outcome. expected = the issued app_id for the matching challenge,
  // observed = the app_id reconstructed from device_sig public values.
  AppIDOutcome app_id = 9;
}

message SmtRootOutcome {
  // "g2" or "g3", derived from cert_chain_type.
  string issuer = 1;
  bool match = 2;
  // 0x-prefixed, lower-case, 32-byte hex.
  string expected = 3;
  string observed = 4;
  // "onchain", "github", or "static".
  string trust_source = 5;
  // RFC3339 timestamp of the last successful refresh.
  string trusted_at = 6;
}

message IssuerModulusOutcome {
  // "g2" or "g3", derived from cert_chain_type.
  string issuer = 1;
  bool match = 2;
  // 0x-prefixed SHA-256 of the trusted MOICA cert DER.
  string expected_sha256 = 3;
  // "embedded" or "https".
  string trust_source = 4;
  // RFC3339 timestamp of the last cache update.
  string trusted_at = 5;
}

message AppIDOutcome {
  bool match = 1;
  // 62-char hex of the app_id issued for the matching challenge.
  string expected = 2;
  // 62-char hex reconstructed from device_sig public values [2..32].
  string observed = 3;
}
