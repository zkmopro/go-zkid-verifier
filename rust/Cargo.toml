[package]
name = "zk_verifier"
version = "0.1.0"
edition = "2021"

[lib]
name = "zk_verifier"
crate-type = ["staticlib", "cdylib"]

[features]
# Enable with: cargo test --features proof-e2e
# Requires `yarn compile:cert_chain_rs4096` and `yarn compile:user_sig_rs2048` to have been run.
proof-e2e = ["openac-mobile-app"]

[dependencies]
ecdsa-spartan2 = { git = "https://github.com/privacy-ethereum/zkID.git", branch = "RSA-X.509-Cert" }
ff = "0.13"
subtle = "2"
openac-mobile-app = { git = "https://github.com/privacy-ethereum/zkID.git", branch = "RSA-X.509-Cert", optional = true, default-features = false, features = [
    "mobile",
] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
