[package]
name = "zk_verifier"
version = "0.1.0"
edition = "2021"

[lib]
name = "zk_verifier"
crate-type = ["staticlib", "cdylib"]

[dependencies]
ecdsa-spartan2 = { path = "../../zkID/wallet-unit-poc/ecdsa-spartan2" }
ff = "0.13"
subtle = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
