name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  challenge-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build challenge server
        run: make build-server

      - name: Test challenge package
        run: make test-challenge

  verifier:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout go-zk-verifier
        uses: actions/checkout@v4
        with:
          path: go-zk-verifier

      - name: Clone zkID at cc21edd
        run: |
          git clone https://github.com/zkmopro/zkID.git zkID
          cd zkID && git checkout cc21edd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install C++ toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y g++ libstdc++-12-dev nasm libgmp-dev

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            go-zk-verifier/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('go-zk-verifier/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-zk-verifier/go.mod
          cache: true

      - name: Build verifier
        working-directory: go-zk-verifier
        run: make build-verifier

      - name: Download verifying key
        working-directory: go-zk-verifier
        run: make download-keys

      - name: Test verifier
        working-directory: go-zk-verifier
        run: make test-verifier

      - name: Verify
        working-directory: go-zk-verifier
        run: make verify
