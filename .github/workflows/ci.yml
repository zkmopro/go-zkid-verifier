name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  challenge-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test store (pure Go)
        run: CGO_ENABLED=0 go test ./store/ -v

  verifier:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout go-zkid-verifier
        uses: actions/checkout@v4
        with:
          path: go-zkid-verifier

      - name: Clone zkID
        run: |
          git clone https://github.com/zkmopro/zkID.git zkID

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install C++ toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y g++ libstdc++-12-dev nasm libgmp-dev

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            go-zkid-verifier/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('go-zkid-verifier/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-zkid-verifier/go.mod
          cache: true

      - name: Build verifier
        working-directory: go-zkid-verifier
        run: make build-verifier

      - name: Download verifying keys
        working-directory: go-zkid-verifier
        run: make download-keys

      - name: Test challenge package
        working-directory: go-zkid-verifier
        run: go test ./challenge/ -v

      - name: Test verifier (link-verify)
        working-directory: go-zkid-verifier
        run: make test-verifier

      - name: Verify (RS2048)
        working-directory: go-zkid-verifier
        run: make verify
