name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout go-zk-verifier
        uses: actions/checkout@v4
        with:
          path: go-zk-verifier

      - name: Clone zkID at cc21edd
        run: |
          git clone https://github.com/zkmopro/zkID.git zkID
          cd zkID && git checkout cc21edd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            go-zk-verifier/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('go-zk-verifier/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-zk-verifier/go.mod
          cache: true

      - name: Build
        working-directory: go-zk-verifier
        run: make build

      - name: Download verifying key
        working-directory: go-zk-verifier
        run: make download-keys

      - name: Test
        working-directory: go-zk-verifier
        run: make test

      - name: Verify
        working-directory: go-zk-verifier
        run: make verify
