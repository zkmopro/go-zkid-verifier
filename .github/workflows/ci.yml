name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  challenge-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test store (pure Go)
        run: CGO_ENABLED=0 go test ./store/ -v

  verifier:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout go-zkid-verifier
        uses: actions/checkout@v4
        with:
          path: go-zkid-verifier

      - name: Clone zkID (pinned for reproducible builds)
        run: |
          git clone https://github.com/zkmopro/zkID.git zkID
          cd zkID && git checkout 056736ae073cb06f3e5efb42172823ccf2c6b5eb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install C++ toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y g++ libstdc++-12-dev nasm libgmp-dev

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            go-zkid-verifier/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('go-zkid-verifier/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-zkid-verifier/go.mod
          cache: true

      - name: Build Rust library and Go binaries
        working-directory: go-zkid-verifier
        run: make build

      - name: Download verifying keys
        working-directory: go-zkid-verifier
        run: make download-keys

      - name: Test challenge package
        working-directory: go-zkid-verifier
        run: go test ./challenge/ -v

      - name: Test link-verify orchestration
        working-directory: go-zkid-verifier
        run: go test ./linkverify/ -v

      - name: Test verifier FFI (RS2048)
        working-directory: go-zkid-verifier
        run: |
          TMPDIR=$(mktemp -d)
          mkdir -p "$TMPDIR/keys"
          cp tests/artifacts/cc2048_ds2048/*.bin "$TMPDIR/keys/"
          ln -s "$(pwd)/keys/cert_chain_rs2048_verifying.key" "$TMPDIR/keys/"
          ln -s "$(pwd)/keys/device_sig_rs2048_verifying.key" "$TMPDIR/keys/"
          ZK_BASE_DIR="$TMPDIR" go test ./verifier/ -v -run TestLinkVerifyRS2048
          rm -rf "$TMPDIR"

      - name: Test verifier FFI (RS4096)
        working-directory: go-zkid-verifier
        run: |
          TMPDIR=$(mktemp -d)
          mkdir -p "$TMPDIR/keys"
          cp tests/artifacts/cc4096_ds2048/*.bin "$TMPDIR/keys/"
          ln -s "$(pwd)/keys/cert_chain_rs4096_verifying.key" "$TMPDIR/keys/"
          ln -s "$(pwd)/keys/device_sig_rs2048_verifying.key" "$TMPDIR/keys/"
          ZK_BASE_DIR="$TMPDIR" go test ./verifier/ -v -run TestLinkVerifyRS4096
          rm -rf "$TMPDIR"
